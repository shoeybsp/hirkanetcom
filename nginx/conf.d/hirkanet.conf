server {
    listen 80;
    listen [::]:80;

    server_name hirkanet.com;

    return 301 https://hirkanet.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hirkanet.com;

    ssl_certificate /etc/letsencrypt/live/hirkanet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirkanet.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://fortigate-app:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
