<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Error{% endblock %} | Hirkanet</title>
    {% include '_brand_head.html' %}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .error-logo { display: block; width: 150px; height: auto; margin: 0 auto 2rem; }
  .error-container {
    text-align: center;
    padding: 3rem 2rem;
    max-width: 520px;
  }
  .error-code {
    font-size: 4rem;
    font-weight: 700;
    color: #64748b;
    margin-bottom: 0.5rem;
  }
  .error-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 1rem;
  }
  .error-message {
    color: #94a3b8;
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  .error-link {
    display: inline-block;
    padding: 0.6rem 1.5rem;
    background: linear-gradient(135deg, #00befb 0%, #0a6cff 100%);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 500;
    transition: background 0.2s;
  }
  .error-link:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="error-container">
    <img class="error-logo" src="{{ url_for('static', filename='img/hirkanet-logo.png') }}" alt="Hirkanet">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
