{% extends "main/base.html" %}
{% block title %}Invalid Request | Hirkanet{% endblock %}
{% block content %}
<section class="container py-5">
    <div class="card stl-card mx-auto" style="max-width: 720px;">
        <div class="card-body p-4">
            <h1 class="h3">Invalid or expired form</h1>
            <p>{{ message }}</p>
            <a class="btn btn-primary" href="{{ request.referrer or url_for('main.home') }}">Return</a>
        </div>
    </div>
</section>
{% endblock %}
