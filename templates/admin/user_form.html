<!DOCTYPE html>
<html>
<head>
    <title>{% if user %}Edit User{% else %}Create User{% endif %} - SecureTrack-Lite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
</head>
<body>
<div class="container py-4 main-container">

    <header class="stl-header mb-4">
        <div class="stl-brand">
            <div>
                <h1 class="stl-title">{% if user %}Edit User{% else %}Create User{% endif %}</h1>
            </div>
        </div>
        <div class="stl-user-nav">
            <a href="{{ url_for('admin.dashboard') }}" class="stl-nav-link">Dashboard</a>
            <a href="{{ url_for('admin.user_list') }}" class="stl-nav-link">Users</a>
            <form method="POST" action="{{ url_for('logout') }}" class="stl-logout-form">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <button type="submit" class="stl-nav-link stl-nav-logout">Sign Out</button>

            </form>
        </div>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="card stl-card">
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold label-color">Username</label>
                    <input type="text" name="username" class="form-control stl-input"
                           value="{{ user.username if user else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold label-color">
                        Password {% if user %}(leave blank to keep current){% endif %}
                    </label>
                    <input type="password" name="password" class="form-control stl-input"
                           {% if not user %}required{% endif %}
                           minlength="4">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold label-color">Role</label>
                    <select name="role" class="form-select stl-input">
                        <option value="client" {% if user and user.role == 'client' %}selected{% endif %}>Client</option>
                        <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary stl-btn-primary">
                    {% if user %}Update User{% else %}Create User{% endif %}
                </button>
                <a href="{{ url_for('admin.user_list') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
