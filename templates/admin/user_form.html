{% extends "admin/base.html" %}

{% block title %}{% if user %}Edit User{% else %}Create User{% endif %} - Hirkanet{% endblock %}
{% block page_title %}{% if user %}Edit User{% else %}Create User{% endif %}{% endblock %}

{% block content %}

<div class="card hk-card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold label-color">Username</label>
                <input type="text" name="username" class="form-control"
                       value="{{ user.username if user else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold label-color">
                    Password {% if user %}(leave blank to keep current){% endif %}
                </label>
                <input type="password" name="password" class="form-control"
                       {% if not user %}required{% endif %}
                       minlength="4">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold label-color">Role</label>
                <select name="role" class="form-select">
                    <option value="client" {% if user and user.role == 'client' %}selected{% endif %}>Client</option>
                    <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">
                {% if user %}Update User{% else %}Create User{% endif %}
            </button>
            <a href="{{ url_for('admin.user_list') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
