{% extends "admin/base.html" %}

{% block title %}Admin Profile - Hirkanet{% endblock %}
{% block page_title %}Admin Profile{% endblock %}
{% block page_subtitle %}Change your password{% endblock %}

{% block content %}

<div class="card hk-card">
    <div class="card-header hk-card-header">
        <h2 class="hk-section-title mb-0">Change Password</h2>
    </div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold label-color">Current Password</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold label-color">New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="4">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold label-color">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>
</div>

{% endblock %}
