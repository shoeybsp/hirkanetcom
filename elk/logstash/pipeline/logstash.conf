input {
  beats {
    id => "hirkanet_beats_tls_input"
    port => 5044

    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
    ssl_client_authentication => "none"
  }
}

filter {
  if [container][labels][hirkanet_log_role] == "application" {
    mutate {
      add_tag => ["hirkanet_application"]
      copy => { "message" => "[@metadata][original_message]" }
    }

    json {
      id => "parse_hirkanet_application_json"
      source => "message"
      ecs_compatibility => "disabled"
      tag_on_failure => ["_hirkanet_json_parse_failure"]
    }

    mutate {
      copy => { "[@metadata][original_message]" => "[event][original]" }
    }

    if "_hirkanet_json_parse_failure" in [tags] {
      mutate {
        replace => { "[event][dataset]" => "hirkanet.dead_letter" }
        add_field => {
          "[event][kind]" => "pipeline_error"
          "[error][type]" => "json_parse_failure"
          "[error][message]" => "Application container log line was not valid JSON"
        }
      }
    } else {
      if [event_type] {
        mutate { copy => { "event_type" => "[event][type]" } }
      }
      if [event_duration] {
        mutate { copy => { "event_duration" => "[event][duration]" } }
      }
      if [http_status_code] {
        mutate { copy => { "http_status_code" => "[http][response][status_code]" } }
      }
      if [user_id] {
        mutate { copy => { "user_id" => "[user][id]" } }
      }
    }
  } else if [container][labels][hirkanet_log_role] == "database" {
    mutate {
      add_tag => ["hirkanet_database"]
      add_field => {
        "[service][name]" => "postgresql"
        "[event][dataset]" => "postgresql.log"
        "[event][kind]" => "event"
      }
      copy => { "message" => "[event][original]" }
    }
  } else {
    drop { }
  }
}

output {
  if "_hirkanet_json_parse_failure" in [tags] {
    elasticsearch {
      id => "hirkanet_dead_letter_output"
      hosts => ["https://elasticsearch:9200"]

      user => "logstash_internal"
      password => "${LOGSTASH_PASSWORD}"

      ssl_enabled => true
      ssl_certificate_authorities => [
        "/usr/share/logstash/config/certs/ca/ca.crt"
      ]
      ssl_verification_mode => "full"

      ilm_enabled => true
      ilm_rollover_alias => "hirkanet-dead-letter"
      ilm_pattern => "000001"
      ilm_policy => "hirkanet-dead-letter-policy"
      manage_template => false
    }
  } else {
    elasticsearch {
      id => "hirkanet_normal_logs_output"
      hosts => ["https://elasticsearch:9200"]

      user => "logstash_internal"
      password => "${LOGSTASH_PASSWORD}"

      ssl_enabled => true
      ssl_certificate_authorities => [
        "/usr/share/logstash/config/certs/ca/ca.crt"
      ]
      ssl_verification_mode => "full"

      ilm_enabled => true
      ilm_rollover_alias => "hirkanet-logs"
      ilm_pattern => "000001"
      ilm_policy => "hirkanet-logs-policy"
      manage_template => false
    }
  }
}
