name: hirkanet-app

x-docker-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    cpus: "0.5"
    mem_limit: 384m
    mem_reservation: 96m
    pids_limit: 128
    env_file:
      - .env
    environment:
      TRUST_PROXY_HEADERS: "false"
      SERVICE_NAME: hirkanet-migrate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    command:
      - /bin/sh
      - -ec
      - |
        python -c "
        import time, os, psycopg2
        for _ in range(60):
            try:
                psycopg2.connect(
                    host='host.docker.internal',
                    port=int(os.environ.get('POSTGRES_PORT', '5432')),
                    user=os.environ['POSTGRES_USER'],
                    password=os.environ['POSTGRES_PASSWORD'],
                    dbname=os.environ['POSTGRES_DB'],
                )
                print('PostgreSQL is ready.')
                break
            except psycopg2.OperationalError:
                print('Waiting for PostgreSQL...')
                time.sleep(1)
        else:
            raise SystemExit('PostgreSQL did not become ready in time')
        "
        flask --app api.app db upgrade && flask --app api.app seed-defaults
    networks:
      - frontend
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    labels:
      hirkanet_log_role: application
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 127.0.0.1:5000:5000
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - hirkanet_data:/app/data
      - ./uploads:/app/uploads
      - ./static/uploads:/app/static/uploads
    command:
      - gunicorn
      - --config
      - gunicorn.conf.py
      - api.app:app
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - frontend
    logging: *default-logging

volumes:
  hirkanet_data:
    # Named volume for application data; Docker will own it with UID 10001

networks:
  frontend:
    driver: bridge
