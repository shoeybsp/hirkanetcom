services:
  db:
    image: postgres:15-alpine
    container_name: fortigate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fortigate_policy
      POSTGRES_USER: fortigate_user
      POSTGRES_PASSWORD: fortigate_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortigate_user -d fortigate_policy"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fortigate-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fortigate_user:fortigate_pass@db:5432/fortigate_policy
      SECRET_KEY: change-this-to-a-secure-random-key
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    command: gunicorn --bind 0.0.0.0:5000 api.app:app

volumes:
  postgres_data: