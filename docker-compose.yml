name: hirkanet-app

x-docker-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    mem_reservation: 256m
    pids_limit: 256
    labels:
      hirkanet_log_role: database
    env_file:
      - .env
    environment:
      TZ: Europe/Riga
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --host=127.0.0.1
          --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app-db
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    cpus: "0.5"
    mem_limit: 384m
    mem_reservation: 96m
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TRUST_PROXY_HEADERS: "false"
      SERVICE_NAME: hirkanet-migrate
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    command:
      - /bin/sh
      - -ec
      - flask --app api.app db upgrade && flask --app api.app seed-defaults
    networks:
      - app-db
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    labels:
      hirkanet_log_role: application
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - 127.0.0.1:5000:5000
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - hirkanet_data:/app/data
      - ./uploads:/app/uploads
      - ./static/uploads:/app/static/uploads
    command:
      - gunicorn
      - --config
      - gunicorn.conf.py
      - api.app:app
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app-db
      - frontend
    logging: *default-logging

  api_v2:
    build:
      context: .
      dockerfile: Dockerfile.api_v2
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 256
    labels:
      hirkanet_log_role: application
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - 127.0.0.1:8010:8010
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app-db
      - frontend
    logging: *default-logging

volumes:
  postgres_data:
    name: hirkanet-app_postgres_data
  hirkanet_data:
    # Named volume for application data; Docker will own it with UID 10001

networks:
  app-db:
    driver: bridge
  frontend:
    driver: bridge
